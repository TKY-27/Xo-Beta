<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>hands isolate</title>
<link rel="icon" href="/favicon.svg">
<style>body{margin:0;background:#888}canvas{display:block}</style>
</head>
<body>
<script type="module">
// Fast hands/viewmodel snapshot harness: mounts the REAL ViewModel updateView
// path (hands rig + ArmSolver) at gameplay hip framing (FOV 80), for pose/
// material iteration without the full 3-minute match-entry probe.
// Query: ?w=ar&ads=0&zoom=0
import * as THREE from 'three';
import { WebGPURenderer } from 'three/webgpu';

const params = new URLSearchParams(location.search);
const weapon = params.get('w') ?? 'ar';
const adsAmount = params.get('ads') === '1' ? 1 : 0;
const zoom = Number(params.get('zoom') ?? '0');

const renderer = new WebGPURenderer({ antialias: true });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
await renderer.init();

const { loadGltf } = await import('/src/assets/assets.ts');
await Promise.all([
  'weapons/authored-pistol.glb',
  'weapons/authored-ar-ak47.glb',
  'weapons/authored-smg-suomi.glb',
   'weapons/authored-shotgun-pump.glb',
   'weapons/authored-sniper-m700.glb',
   'hands/authored-tactical-hand.glb',
  'hands/libhand-hand.glb',
     'hands/authored-sleeve.glb',

].map((path) => loadGltf(path)));
window.__xoQaAuthoredAssetsLoaded = true;
const { ViewModel } = await import('/src/render/viewmodel.ts');
const { ViewModelStage } = await import('/src/render/viewmodelStage.ts');
const { WeaponModelFactory } = await import('/src/render/weaponModels.ts');

const stage = new ViewModelStage();
stage.scene.background = new THREE.Color(0x8fa3b5);
stage.resize(innerWidth, innerHeight);
stage.syncLighting(new THREE.Quaternion(), {
  sunColor: new THREE.Color(0xfff1d8),
  sunIntensity: 2.2,
  sunDirection: new THREE.Vector3(0.4, 0.8, 0.6),
  hemiSkyColor: new THREE.Color(0xc5d8ea),
  hemiGroundColor: new THREE.Color(0x4a5148),
  hemiIntensity: 0.8,
  ambientColor: new THREE.Color(0xbecddd),
  ambientIntensity: 0.4,
  environment: null,
  environmentIntensity: 0.4,
});
const scene = stage.scene;
const camera = stage.camera;

const factory = new WeaponModelFactory(null);
const viewmodel = new ViewModel(factory);
if (params.get('hideSleeves') === '1') viewmodel.armSolver.group.visible = false;
if (params.get('hideHands') === '1') for (const rig of viewmodel.rigs.values()) { rig.right.visible = false; rig.left.visible = false; }
if (params.get('hideViewmodel') === '1') viewmodel.group.visible = false;
const hideViewmodel = params.get('hideViewmodel') === '1';
const hideWeapon = params.get('hideWeapon') === '1';
const onlyMesh = params.get('onlyMesh');
scene.add(viewmodel.group);
viewmodel.syncCamera(camera);

const rarity = params.get('rarity') ?? 'epic';
const unarmed = weapon === 'none';
const actor = {
  id: 1, displayName: 'LOCAL', ownership: { kind: 'local-human', peerId: 'p' },
  connectionState: 'connected', teamId: null, skinId: 'vanguard', accentColor: 0x33aaff,
  alive: true, health: 100, shield: 100,
  position: { x: 0, y: 0, z: 0 }, velocity: { x: 0, y: 0, z: 0 },
  yaw: 0, pitch: 0, grounded: true, moveState: 'ground', crouched: false, deployed: true,
  equippedWeapon: unarmed ? null : weapon,
  inventory: {
    selected: 0,
    slots: unarmed
      ? [null, null, null, null, null]
      : [{ kind: 'weapon', weaponId: weapon, rarity, ammoInMag: 30 }, null, null, null, null],
    ammo: { light: 0, medium: 90, shells: 0, heavy: 0 }, healing: null,
  },
  placement: 0,
  stats: { kills: 0, damageDealt: 0, shotsFired: 0, shotsHit: 0, headshots: 0, survivalTime: 0 },
};

// Warm the presentation springs to steady state, then hold the hip pose.
for (let i = 0; i < 120; i++) viewmodel.updateView(actor, 1 / 60, 0, 0, 0, { adsAmount });
viewmodel.updateView(actor, 1 / 60, 0, 0, 0, { adsAmount });
const action = params.get('action');
const frozenPhase = params.has('phase') ? Number(params.get('phase')) : null;
if (action === 'pump' && weapon === 'shotgun') viewmodel.notifyShotFired('shotgun');
if (action === 'reload' && weapon !== 'none') viewmodel.notifyReloadStarted(weapon, rarity, params.get('empty') === '1');

if (zoom > 0) {
  // Punch in on the grip area for contact inspection (does not move the rig):
  // narrow FOV + aim the camera at the trigger-hand region in view space.
  camera.fov = 55 / zoom;
  const aims = {
    grip: [0.1, -0.1, -0.22],
    // Support-hand contact zone (under/side forend grip) at hip framing.
    left: [0.04, -0.12, -0.4],
    // Right-grip contact from the right side (hip framing).
    right: [0.13, -0.11, -0.24],
  };
  const aim = aims[params.get('aim') ?? 'grip'] ?? aims.grip;
  camera.lookAt(aim[0], aim[1], aim[2]);
  camera.updateProjectionMatrix();
}
window.__ready = true;
window.__vm = viewmodel;
window.__stage = stage;
window.__camera = camera;

// QA_GIZMO=1: overlay the grip pose basis on the RIGHT hand (red = palm
// normal (local -y), green = finger-extend (local -z), blue = hand-local
// +z toward the wrist) so pose vectors tune against the geometry directly.
if (params.get('gizmo') === '1') {
  const mk = (color) => {
    const g = new THREE.Group();
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.14), new THREE.MeshBasicMaterial({ color }));
    shaft.rotation.x = Math.PI / 2;
    shaft.position.z = 0.07;
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.012, 0.03), new THREE.MeshBasicMaterial({ color }));
    tip.rotation.x = -Math.PI / 2;
    tip.position.z = 0.155;
    g.add(shaft, tip);
    return g;
  };
  const palmArrow = mk(0xff3040);
  palmArrow.rotation.x = Math.PI / 2; // +z -> -y (palm faces local -y)
  const fingersArrow = mk(0x30ff40);
  fingersArrow.rotation.x = Math.PI;  // +z -> -z (fingers extend local -z)
  const zedArrow = mk(0x3060ff);      // +z (toward the wrist)
  for (const key of viewmodel.rigs.keys()) viewmodel.rigs.get(key).right.add(palmArrow, fingersArrow, zedArrow);
}

const errors = [];
window.addEventListener('error', (e) => errors.push(String(e.error ?? e.message)));

const loop = () => {
  if (frozenPhase !== null && Number.isFinite(frozenPhase)) {
    if (action === 'pump' && viewmodel.presentBoltTotal > 0) viewmodel.presentBoltElapsed = viewmodel.presentBoltTotal * frozenPhase;
    if (action === 'reload' && viewmodel.presentReloadTotal > 0) viewmodel.presentReloadElapsed = viewmodel.presentReloadTotal * frozenPhase;
  }
  viewmodel.updateView(actor, 1 / 60, 0, 0, 0, { adsAmount });
  if (params.get('hideSleeves') === '1') viewmodel.armSolver.group.visible = false;
  if (hideViewmodel) viewmodel.group.visible = false;
  if (hideWeapon && viewmodel.currentModel) viewmodel.currentModel.group.visible = false;
  if (onlyMesh && viewmodel.currentModel) viewmodel.currentModel.group.traverse((object) => {
    if (object.isMesh) object.visible = object.name === onlyMesh;
  });
  if (params.get('hideUpperSleeve') === '1') viewmodel.armSolver.group.traverse((object) => { if (object.name.includes('sleeve-upper')) object.visible = false; });
  if (params.get('hideHands') === '1') for (const rig of viewmodel.rigs.values()) { rig.right.visible = false; rig.left.visible = false; }
  renderer.renderAsync(scene, camera).catch((e) => errors.push(String(e)));
  requestAnimationFrame(loop);
};
loop();
window.__errors = errors;
console.log('HANDS_ISOLATE_READY');
</script>
</body>
</html>
