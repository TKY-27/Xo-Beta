name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Secret scan
        run: npm run audit:secrets

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Production asset audit
        run: npm run audit:assets

      - name: Dependency license audit
        run: npm run audit:licenses

      - name: Unit and integration tests
        run: npm run test
        timeout-minutes: 15

      - name: Production build
        run: npm run build

      - name: Cloudflare packaging dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
