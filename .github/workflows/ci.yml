name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Secret scan
        run: npm run audit:secrets

      - name: Unit tests
        run: npx vitest run tests/unit

      - name: Integration tests (headless matches)
        run: npx vitest run tests/integration
        timeout-minutes: 15

      - name: Production build
        run: npm run build

      - name: Dependency license audit
        run: npm run audit:licenses

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
